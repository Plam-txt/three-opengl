plugins {
    id 'application'
}
repositories {
    mavenCentral()
}

ext{
    lwjglProperties = [
            version: "3.3.4",
            natives: "natives-" + (System.getProperty("os.name").toLowerCase().contains("win") ? "windows" :
                    System.getProperty("os.name").toLowerCase().contains("mac") ? "macos" : "linux")
    ]
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:3.3.4")
//opengl
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"

    implementation "org.lwjgl:lwjgl-stb:${lwjglProperties.version}"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglProperties.version}:${lwjglProperties.natives}"
//gson
    implementation 'com.google.code.gson:gson:2.15.0'


    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
application {
    mainClass = 'psn'
}
